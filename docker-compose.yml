# Banco local do pipeline. Só escuta em 127.0.0.1; senha de uso local, sem dado sensível.
# Imagem com pgvector porque a última camada grava embeddings para o RAG.
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: bcb
      POSTGRES_PASSWORD: bcb-local-only
      POSTGRES_DB: bcb
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcb -d bcb"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
