[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bcb-data-pipeline"
version = "0.1.0"
description = "Pipeline de dados do Banco Central: ingestão incremental, dbt, Dagster e RAG"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "dbt-core>=1.9",
    "dbt-postgres>=1.9",
    "dagster>=1.10",
    "dagster-dbt>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "dagster-webserver>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
